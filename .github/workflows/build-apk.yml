name: Build Reality AI Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 Java 17 环境
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 配置 Gradle 8.5 环境
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: 生成 Release 签名证书 (Keystore)
        run: |
          if [ ! -f app/release.keystore ]; then
            keytool -genkey -v -keystore app/release.keystore \
              -alias realityai -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass realityai -keypass realityai \
              -dname "CN=RealityAI, OU=Dev, O=Zerone, L=LA, S=CA, C=US"
          fi

      - name: 构建 Release APK
        env:
          KEYSTORE_PASSWORD: realityai
          KEY_ALIAS: realityai
          KEY_PASSWORD: realityai
        run: |
          gradle assembleRelease --stacktrace
          cd app/build/outputs/apk/release
          cp app-release.apk "🔥Reality AI_v1.0.4.apk"

      - name: 上传构建产物 (APK Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: RealityAI-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: 自动发布至 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          tag_name: v1.0.0
          name: "🔥 Reality AI 官方独立安卓客户端 v1.0.0"
          make_latest: true
          body: |
            ## 🔥 Reality AI 官方独立安卓客户端正式发布

            ### ✨ 核心体验与特性
            - **沉浸式暗黑高斯玻璃全屏**：消除一切网页套壳感，黑曜石暗黑背景杜绝启动白闪。
            - **原生相册一键直存**：长按出图呼出保存对话框，全兼容 Blob、Base64 与原生 MediaStore。
            - **图生图支持**：完整集成系统级文件选择器，完美支持参考图直接上传。
            - **防循环退出与智能路由**：短网址与重定向历史栈防死循环，双击返回优雅退出。
            - **动态容错与云端热更**：直达 9950 服务器控制端，免重新安装无感维护。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
